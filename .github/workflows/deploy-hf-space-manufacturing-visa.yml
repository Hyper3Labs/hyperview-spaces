name: Deploy HF Space - Manufacturing VisA

on:
  push:
    branches: [main]
    paths:
      - demos/manufacturing-visa-reference-clip-hyper3clip/**
      - .github/workflows/deploy-hf-space-manufacturing-visa.yml
      - .github/workflows/deploy-hf-space-reusable.yml
  workflow_dispatch:

concurrency:
  group: deploy-hf-space-manufacturing-visa
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-hf-space-reusable.yml
    with:
      source_dir: demos/manufacturing-visa-reference-clip-hyper3clip
      space_id: hyper3labs/HyperView-VisA-Manufacturing
