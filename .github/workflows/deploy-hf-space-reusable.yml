name: Deploy Hugging Face Space (Reusable)

# Two ways to put a Live Space on Hugging Face, selected by `deploy_mode`:
#
#   docker-folder  Sync `demos/<slug>/` to the Space root. The Space's own
#                  Dockerfile builds the image and `demo.py` rebuilds the
#                  workspace at boot. Only works when the demo can prepare its
#                  own data inside the container.
#   live-bundle    Publish an exported HyperView bundle - the same artifact the
#                  landing site serves as a Static Space - with
#                  `hyperview publish --mode live`. The generated image runs
#                  `hyperview serve --from <bundle> --public`, so the container
#                  restores prepared data instead of recomputing it.
#
# Both paths authenticate the same way: `id-token: write` plus
# `HF_OIDC_RESOURCE=spaces/<owner>/<name>` lets huggingface_hub exchange the
# GitHub Actions OIDC id token for a short-lived, repo-scoped Hugging Face
# token. The Trusted Publisher on the Space is keyed to the *caller* workflow's
# filename, so renaming a caller breaks the trust until the Space is updated.

on:
  workflow_call:
    inputs:
      space_id:
        description: "Hugging Face Space ID (owner/space-name)"
        required: true
        type: string
      deploy_mode:
        description: "docker-folder (sync the demo folder) or live-bundle (publish an exported bundle)"
        required: false
        default: docker-folder
        type: string
      source_dir:
        description: "docker-folder mode: repository folder to sync to the Space root"
        required: false
        default: ""
        type: string
      bundle_slug:
        description: "live-bundle mode: bundle directory name under public/spaces/ in the site repository"
        required: false
        default: ""
        type: string
      hyperview_version:
        description: "live-bundle mode: released HyperView version to install and to pin in the image"
        required: false
        default: ""
        type: string
      extra_pip:
        description: "live-bundle mode: additional pinned requirements for the image, one per line"
        required: false
        default: ""
        type: string
      site_repository:
        description: "live-bundle mode: repository holding the exported bundles"
        required: false
        default: Hyper3Labs/hyper3labs.github.io
        type: string
      site_ref:
        description: "live-bundle mode: branch or tag of the site repository to read the bundle from"
        required: false
        default: main
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate inputs
        env:
          DEPLOY_MODE: ${{ inputs.deploy_mode }}
          SOURCE_DIR: ${{ inputs.source_dir }}
          BUNDLE_SLUG: ${{ inputs.bundle_slug }}
          HYPERVIEW_VERSION: ${{ inputs.hyperview_version }}
        run: |
          set -euo pipefail
          case "${DEPLOY_MODE}" in
            docker-folder)
              [[ -n "${SOURCE_DIR}" ]] || { echo "docker-folder mode needs source_dir"; exit 1; }
              ;;
            live-bundle)
              [[ -n "${BUNDLE_SLUG}" ]] || { echo "live-bundle mode needs bundle_slug"; exit 1; }
              [[ -n "${HYPERVIEW_VERSION}" ]] || { echo "live-bundle mode needs hyperview_version"; exit 1; }
              case "${HYPERVIEW_VERSION}" in
                *dev*|*+*) echo "hyperview_version must be a released version, got ${HYPERVIEW_VERSION}"; exit 1 ;;
              esac
              ;;
            *)
              echo "Unknown deploy_mode: ${DEPLOY_MODE} (use docker-folder or live-bundle)"
              exit 1
              ;;
          esac
          echo "Deploying ${DEPLOY_MODE}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # --- docker-folder ------------------------------------------------

      - name: Checkout
        if: inputs.deploy_mode == 'docker-folder'
        uses: actions/checkout@v6

      - name: Install Hugging Face client
        if: inputs.deploy_mode == 'docker-folder'
        run: python -m pip install --disable-pip-version-check "huggingface_hub>=1.19"

      - name: Validate source folder
        if: inputs.deploy_mode == 'docker-folder'
        env:
          SOURCE_DIR: ${{ inputs.source_dir }}
        run: |
          set -euo pipefail
          src="${SOURCE_DIR}"

          [[ -d "$src" ]] || { echo "Missing source folder: $src"; exit 1; }
          [[ -f "$src/README.md" ]] || { echo "Missing $src/README.md"; exit 1; }
          [[ -f "$src/Dockerfile" ]] || { echo "Missing $src/Dockerfile"; exit 1; }

      - name: Sync folder to Hugging Face Space
        if: inputs.deploy_mode == 'docker-folder'
        env:
          HF_OIDC_RESOURCE: spaces/${{ inputs.space_id }}
          SPACE_ID: ${{ inputs.space_id }}
          SOURCE_DIR: ${{ inputs.source_dir }}
        run: |
          set -euo pipefail
          hf upload "${SPACE_ID}" "${SOURCE_DIR}" . \
            --repo-type space \
            --delete "*" \
            --commit-message "Deploy ${SPACE_ID} from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"

      # --- live-bundle --------------------------------------------------

      - name: Checkout the bundle site
        if: inputs.deploy_mode == 'live-bundle'
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.site_repository }}
          ref: ${{ inputs.site_ref }}
          path: site

      - name: Install HyperView
        if: inputs.deploy_mode == 'live-bundle'
        env:
          HYPERVIEW_VERSION: ${{ inputs.hyperview_version }}
        run: |
          set -euo pipefail
          # huggingface_hub is pinned above the version that added Trusted
          # Publisher OIDC token exchange; the hyperview[publish] extra alone
          # allows older clients that would fail to authenticate here.
          python -m pip install --disable-pip-version-check \
            "hyperview[publish]==${HYPERVIEW_VERSION}" \
            "huggingface_hub>=1.19"
          python -c "import hyperview; print('hyperview', hyperview.__version__)"

      - name: Compose the publish command
        if: inputs.deploy_mode == 'live-bundle'
        env:
          SPACE_ID: ${{ inputs.space_id }}
          BUNDLE_SLUG: ${{ inputs.bundle_slug }}
          HYPERVIEW_VERSION: ${{ inputs.hyperview_version }}
          EXTRA_PIP: ${{ inputs.extra_pip }}
          SITE_REPOSITORY: ${{ inputs.site_repository }}
        run: |
          set -euo pipefail
          bundle_dir="site/public/spaces/${BUNDLE_SLUG}"
          [[ -d "$bundle_dir" ]] || { echo "Missing bundle: ${SITE_REPOSITORY}:public/spaces/${BUNDLE_SLUG}"; exit 1; }
          [[ -f "$bundle_dir/hyperview-static.json" ]] || {
            echo "Not a HyperView bundle (no hyperview-static.json): $bundle_dir"
            exit 1
          }
          site_sha="$(git -C site rev-parse --short HEAD)"

          # One argument per line, consumed with `mapfile` below, so a
          # requirement or a commit message never has to survive re-quoting.
          {
            printf '%s\n' "$bundle_dir"
            printf '%s\n' "--to" "hf:${SPACE_ID}"
            printf '%s\n' "--mode" "live"
            printf '%s\n' "--extra-pip" "hyperview==${HYPERVIEW_VERSION}"
            while IFS= read -r requirement; do
              trimmed="$(printf '%s' "$requirement" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
              [[ -n "$trimmed" ]] || continue
              printf '%s\n' "--extra-pip" "$trimmed"
            done <<< "${EXTRA_PIP}"
            printf '%s\n' "--commit-message" \
              "Publish ${BUNDLE_SLUG} bundle (${SITE_REPOSITORY}@${site_sha}) from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
          } > "${RUNNER_TEMP}/publish-args"
          cat "${RUNNER_TEMP}/publish-args"

      - name: Render the Space (dry run)
        if: inputs.deploy_mode == 'live-bundle'
        run: |
          set -euo pipefail
          # No network, no token: a bundle that cannot be read, or pins that pip
          # could never resolve, fail here rather than half-way through an upload.
          mapfile -t args < "${RUNNER_TEMP}/publish-args"
          hyperview publish "${args[@]}" --dry-run

      - name: Publish the Live Space
        if: inputs.deploy_mode == 'live-bundle'
        env:
          # huggingface_hub exchanges the GitHub OIDC id token for a token
          # scoped to this Space; `hyperview publish` picks it up through the
          # ordinary `HfApi()` token resolution.
          HF_OIDC_RESOURCE: spaces/${{ inputs.space_id }}
        run: |
          set -euo pipefail
          mapfile -t args < "${RUNNER_TEMP}/publish-args"
          hyperview publish "${args[@]}"
