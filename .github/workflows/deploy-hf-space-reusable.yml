name: Deploy Hugging Face Space (Reusable)

on:
  workflow_call:
    inputs:
      space_id:
        description: "Hugging Face Space ID (owner/space-name)"
        required: true
        type: string
      source_dir:
        description: "Repository folder to sync to Space root"
        required: true
        type: string
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install Hugging Face client
        run: python -m pip install --disable-pip-version-check "huggingface_hub>=1.19"

      - name: Validate source folder
        run: |
          set -euo pipefail
          src="${{ inputs.source_dir }}"

          [[ -d "$src" ]] || { echo "Missing source folder: $src"; exit 1; }
          [[ -f "$src/README.md" ]] || { echo "Missing $src/README.md"; exit 1; }
          [[ -f "$src/Dockerfile" ]] || { echo "Missing $src/Dockerfile"; exit 1; }

      - name: Sync folder to Hugging Face Space
        env:
          HF_OIDC_RESOURCE: spaces/${{ inputs.space_id }}
          SPACE_ID: ${{ inputs.space_id }}
          SOURCE_DIR: ${{ inputs.source_dir }}
        run: |
          set -euo pipefail
          hf upload "${SPACE_ID}" "${SOURCE_DIR}" . \
            --repo-type space \
            --delete "*" \
            --commit-message "Deploy ${SPACE_ID} from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
