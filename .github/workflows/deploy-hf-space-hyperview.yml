name: Deploy HF Space - HyperView iNat24 Tiny

on:
  push:
    branches: [main]
    paths:
      - demos/inat24-tiny-clip-hycoclip/**
      - .github/workflows/deploy-hf-space-hyperview.yml
      - .github/workflows/deploy-hf-space-reusable.yml
  repository_dispatch:
    types: [pypi-release]
  workflow_dispatch:

concurrency:
  group: deploy-hf-space-hyperview
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-hf-space-reusable.yml
    with:
      deploy_mode: docker-folder
      source_dir: demos/inat24-tiny-clip-hycoclip
      space_id: hyper3labs/HyperView
