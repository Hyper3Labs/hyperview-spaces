name: Deploy HF Space - HyperView Hello World

# live-bundle mode: the Space serves static-spaces/hello-world, so it starts in
# seconds and downloads no dataset or model at boot. To change what it shows,
# rerun demos/hello-world-inat24-clip-hyper3clip/demo.py, re-export the
# `hello-world` workspace into static-spaces/hello-world and commit it.
#
# The Trusted Publisher on hyper3labs/HyperView is keyed to this filename.

on:
  push:
    branches: [main]
    paths:
      - static-spaces/hello-world/**
      - live-spaces.registry.json
      - .github/workflows/deploy-hf-space-reusable.yml
      - .github/workflows/deploy-hf-space-hyperview.yml
  repository_dispatch:
    types: [static-bundle-published]
  workflow_dispatch:

concurrency:
  group: deploy-hf-space-hyperview
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-hf-space-reusable.yml
    with:
      deploy_mode: live-bundle
      bundle_slug: hello-world
      hyperview_version: "1.2.0"
      extra_pip: |
        hyper-models[ml]==0.4.0
      space_id: hyper3labs/HyperView
