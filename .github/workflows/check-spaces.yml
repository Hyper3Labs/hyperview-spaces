name: Check demo registries

on:
  push:
    branches: [main]
    paths:
      - "live-spaces.registry.json"
      - "static-spaces.registry.json"
      - "demos/**"
      - "archived-spaces/**"
      - ".github/workflows/**"
      - "README.md"
      - "scripts/**"
      - "ruff.toml"
  pull_request:
    paths:
      - "live-spaces.registry.json"
      - "demos/**"
      - "archived-spaces/**"
      - "static-spaces.registry.json"
      - ".github/workflows/**"
      - "README.md"
      - "scripts/**"
      - "ruff.toml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # check_spaces.py reads the panel SDK contract from the installed
      # HyperView instead of keeping its own copy of the hook list.
      - run: python -m pip install --disable-pip-version-check "hyperview==1.1.1" "ruff==0.16.7"
      - run: python scripts/check_spaces.py
      - run: python scripts/check_static_spaces.py
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: ruff check demos scripts
