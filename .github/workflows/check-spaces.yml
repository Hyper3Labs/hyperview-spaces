name: Check demo registries

on:
  pull_request:
    paths:
      - "live-spaces.registry.json"
      - "demos/**"
      - "shared-views.registry.json"
      - ".github/workflows/**"
      - "README.md"
      - "scripts/check_spaces.py"
      - "scripts/check_shared_views.py"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: python scripts/check_spaces.py
      - run: python scripts/check_shared_views.py
