name: Check spaces registry

on:
  pull_request:
    paths:
      - "spaces.registry.json"
      - "spaces/**"
      - ".github/workflows/**"
      - "README.md"
      - "scripts/check_spaces.py"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: python scripts/check_spaces.py
