name: Deploy HF Space - HyperView Art Text Search

on:
  push:
    branches: [main]
    paths:
      - spaces/art-text-search-clip-hyper3clip/**
      - .github/workflows/deploy-hf-space-art-text-search.yml
      - .github/workflows/deploy-hf-space-reusable.yml
  workflow_dispatch:

concurrency:
  group: deploy-hf-space-art-text-search
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/deploy-hf-space-reusable.yml
    with:
      source_dir: spaces/art-text-search-clip-hyper3clip
      space_id: hyper3labs/HyperView-Art-Text-Search
    secrets: inherit
