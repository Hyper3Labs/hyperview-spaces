name: Deploy HF Space - HyperView DeepFashion Text Search

# live-bundle mode: the deployed artifact is static-spaces/fashion-products, not
# the demo folder. Re-export and commit that bundle to roll the Live Space
# forward; edits under demos/ alone do not deploy.

on:
  push:
    branches: [main]
    paths:
      - static-spaces/fashion-products/**
      - live-spaces.registry.json
      - .github/workflows/deploy-hf-space-fashion-deepfashion.yml
      - .github/workflows/deploy-hf-space-reusable.yml
  repository_dispatch:
    types: [static-bundle-published]
  workflow_dispatch:

concurrency:
  group: deploy-hf-space-fashion-deepfashion
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-hf-space-reusable.yml
    with:
      deploy_mode: live-bundle
      bundle_slug: fashion-products
      hyperview_version: "1.2.0"
      extra_pip: |
        hyper-models[ml]==0.4.0
      space_id: hyper3labs/HyperView-DeepFashion-Text-Search
