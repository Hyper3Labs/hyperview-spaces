name: Deploy HF Space - HyperView DeepFashion Text Search

# live-bundle mode: the deployed artifact is the exported bundle committed to
# the landing site, not this repository's demo folder. Nothing under
# demos/fashion-deepfashion-text-search-clip-hyper3clip triggers a deploy;
# after re-exporting and committing the bundle on the site, run this workflow
# with workflow_dispatch (or send a `static-bundle-published` repository
# dispatch) to roll the Live Space forward.

on:
  push:
    branches: [main]
    paths:
      - live-spaces.registry.json
      - .github/workflows/deploy-hf-space-fashion-deepfashion.yml
      - .github/workflows/deploy-hf-space-reusable.yml
  repository_dispatch:
    types: [static-bundle-published]
  workflow_dispatch:

concurrency:
  group: deploy-hf-space-fashion-deepfashion
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-hf-space-reusable.yml
    with:
      deploy_mode: live-bundle
      bundle_slug: fashion-products
      hyperview_version: "1.1.1"
      extra_pip: |
        hyper-models[ml]==0.3.1
      space_id: hyper3labs/HyperView-DeepFashion-Text-Search
